<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#f3f5f9"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="redCardSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="llmGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9ece1"/>
      <stop offset="100%" stop-color="#b9dcc9"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="amberSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="scoreGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="scoreAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="scoreRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="1.5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- ===== TOP: Three input chips ===== -->
  <g font-weight="700">
    <g filter="url(#softShadow)">
      <rect x="290" y="20" width="200" height="62" rx="10" fill="url(#redCard)"/>
      <rect x="290" y="20" width="200" height="20" rx="10" fill="rgba(255,255,255,0.12)"/>
      <text x="390" y="52" text-anchor="middle" fill="#ffffff" font-size="13">Transaction</text>
      <text x="390" y="70" text-anchor="middle" fill="#ffffff" font-size="13">Description</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="510" y="20" width="220" height="62" rx="10" fill="url(#redCard)"/>
      <rect x="510" y="20" width="220" height="20" rx="10" fill="rgba(255,255,255,0.12)"/>
      <text x="620" y="44" text-anchor="middle" fill="#ffffff" font-size="13">Transaction status</text>
      <text x="620" y="62" text-anchor="middle" fill="#ffffff" font-size="13">(Pending vs Posted)</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="750" y="20" width="220" height="62" rx="10" fill="url(#redCard)"/>
      <rect x="750" y="20" width="220" height="20" rx="10" fill="rgba(255,255,255,0.12)"/>
      <text x="860" y="44" text-anchor="middle" fill="#ffffff" font-size="13">User utterance</text>
      <text x="860" y="62" text-anchor="middle" fill="#ffffff" font-size="13">(dispute, cancel, or fraud)</text>
    </g>
  </g>

  <!-- Converging arrows to Model Response -->
  <path d="M390 84 C390 100, 540 110, 555 130" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 84 L620 130" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M860 84 C860 100, 700 110, 685 130" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== Model Response ===== -->
  <g filter="url(#softShadow)">
    <rect x="470" y="132" width="300" height="74" rx="10" fill="url(#redCardSoft)"/>
    <text x="620" y="156" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700" letter-spacing="0.4">MODEL RESPONSE</text>
    <line x1="495" y1="164" x2="745" y2="164" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="620" y="184" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="500">Merchant info +</text>
    <text x="620" y="200" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="500">Suggestions</text>
  </g>

  <path d="M620 208 L620 230" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== Prompting LLM panel ===== -->
  <g filter="url(#softShadow)">
    <rect x="450" y="234" width="340" height="160" rx="16" fill="url(#llmGreen)" stroke="#7fb89a" stroke-width="1.4"/>
    <g transform="translate(498, 258)">
      <path d="M40 8 C24 8, 14 24, 18 40 C10 46, 12 62, 22 68 C26 80, 40 82, 48 76 L48 14 C44 10, 42 8, 40 8 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="2"/>
      <path d="M56 8 C72 8, 82 24, 78 40 C86 46, 84 62, 74 68 C70 80, 56 82, 48 76 L48 14 C52 10, 54 8, 56 8 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="2"/>
      <circle cx="30" cy="28" r="2.8" fill="#2f7d57"/>
      <circle cx="40" cy="42" r="2.8" fill="#2f7d57"/>
      <circle cx="30" cy="56" r="2.8" fill="#2f7d57"/>
      <circle cx="66" cy="28" r="2.8" fill="#2f7d57"/>
      <circle cx="56" cy="42" r="2.8" fill="#2f7d57"/>
      <circle cx="66" cy="56" r="2.8" fill="#2f7d57"/>
      <line x1="30" y1="28" x2="40" y2="42" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="40" y1="42" x2="30" y2="56" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="66" y1="28" x2="56" y2="42" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="56" y1="42" x2="66" y2="56" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="40" y1="42" x2="56" y2="42" stroke="#2f7d57" stroke-width="1.4"/>
    </g>
    <text x="670" y="320" text-anchor="middle" fill="#14532d" font-size="20" font-weight="700">Prompting</text>
    <text x="670" y="346" text-anchor="middle" fill="#14532d" font-size="20" font-weight="700">LLM</text>
  </g>

  <!-- Branch arrows: LLM → judges -->
  <path d="M450 314 L285 314" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 314 L955 314" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== Judge Section 0 (left) ===== -->
  <g filter="url(#softShadow)">
    <rect x="80" y="284" width="200" height="60" rx="10" fill="url(#amberCard)" stroke="#a16207" stroke-width="1.2"/>
    <text x="180" y="308" text-anchor="middle" fill="#422006" font-size="14" font-weight="700">Judge Section 0</text>
    <text x="180" y="328" text-anchor="middle" fill="#422006" font-size="13" font-weight="600">Merchant Info</text>
  </g>

  <!-- ===== Judge Section 1 (right) ===== -->
  <g filter="url(#softShadow)">
    <rect x="960" y="284" width="200" height="60" rx="10" fill="url(#amberCard)" stroke="#a16207" stroke-width="1.2"/>
    <text x="1060" y="308" text-anchor="middle" fill="#422006" font-size="14" font-weight="700">Judge Section 1</text>
    <text x="1060" y="328" text-anchor="middle" fill="#422006" font-size="13" font-weight="600">Suggestions</text>
  </g>

  <!-- Vertical branch trunks -->
  <path d="M180 344 L180 510" stroke="#94a3b8" stroke-width="1.4" fill="none"/>
  <path d="M1060 344 L1060 510" stroke="#94a3b8" stroke-width="1.4" fill="none"/>

  <!-- ===== Score chips - Section 0 ===== -->
  <g font-size="12" font-weight="600">
    <path d="M180 385 L200 385" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="205" y="370" width="170" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="205" y="370" width="50" height="30" rx="15" fill="url(#scoreGreen)"/>
      <text x="230" y="390" text-anchor="middle" fill="#ffffff" font-weight="700">1.0</text>
      <text x="320" y="390" text-anchor="middle" fill="#14532d">Correct</text>
    </g>
    <path d="M180 445 L200 445" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="205" y="430" width="170" height="30" rx="15" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="205" y="430" width="50" height="30" rx="15" fill="url(#scoreAmber)"/>
      <text x="230" y="450" text-anchor="middle" fill="#ffffff" font-weight="700">0.5</text>
      <text x="320" y="450" text-anchor="middle" fill="#78350f">Minor Issues</text>
    </g>
    <path d="M180 505 L200 505" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="205" y="490" width="170" height="30" rx="15" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="205" y="490" width="50" height="30" rx="15" fill="url(#scoreRed)"/>
      <text x="230" y="510" text-anchor="middle" fill="#ffffff" font-weight="700">0.0</text>
      <text x="320" y="510" text-anchor="middle" fill="#7f1d1d">Major Issues</text>
    </g>
  </g>

  <!-- ===== Score chips - Section 1 ===== -->
  <g font-size="12" font-weight="600">
    <path d="M1060 385 L1040 385" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="865" y="370" width="170" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="985" y="370" width="50" height="30" rx="15" fill="url(#scoreGreen)"/>
      <text x="1010" y="390" text-anchor="middle" fill="#ffffff" font-weight="700">1.0</text>
      <text x="920" y="390" text-anchor="middle" fill="#14532d">Correct</text>
    </g>
    <path d="M1060 445 L1040 445" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="865" y="430" width="170" height="30" rx="15" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="985" y="430" width="50" height="30" rx="15" fill="url(#scoreAmber)"/>
      <text x="1010" y="450" text-anchor="middle" fill="#ffffff" font-weight="700">0.5</text>
      <text x="920" y="450" text-anchor="middle" fill="#78350f">Minor Issues</text>
    </g>
    <path d="M1060 505 L1040 505" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="865" y="490" width="170" height="30" rx="15" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="985" y="490" width="50" height="30" rx="15" fill="url(#scoreRed)"/>
      <text x="1010" y="510" text-anchor="middle" fill="#ffffff" font-weight="700">0.0</text>
      <text x="920" y="510" text-anchor="middle" fill="#7f1d1d">Major Issues</text>
    </g>
  </g>

  <!-- Converging into "Scores with explanations" -->
  <path d="M180 511 C180 555, 460 565, 530 575" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M1060 511 C1060 555, 780 565, 710 575" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- ===== Scores with explanations ===== -->
  <g filter="url(#softShadow)">
    <rect x="530" y="575" width="180" height="50" rx="10" fill="url(#amberCard)" stroke="#a16207" stroke-width="1.2"/>
    <text x="620" y="597" text-anchor="middle" fill="#422006" font-size="13.5" font-weight="700">Scores with</text>
    <text x="620" y="614" text-anchor="middle" fill="#422006" font-size="13.5" font-weight="700">explanations</text>
  </g>

  <!-- ===== Formula ===== -->
  <g filter="url(#softShadow)">
    <rect x="170" y="640" width="860" height="50" rx="12" fill="url(#amberSoft)" stroke="#d97706" stroke-width="1.4"/>
    <text x="200" y="672" fill="#422006" font-size="15" font-style="italic" font-weight="600">Overall correctness score</text>
    <text x="445" y="672" fill="#422006" font-size="18" font-weight="600">=</text>
    <text x="700" y="660" text-anchor="middle" fill="#422006" font-size="14" font-style="italic" font-weight="600">
      Section 0 Score + Section 1 Score
    </text>
    <line x1="475" y1="668" x2="925" y2="668" stroke="#422006" stroke-width="1.8"/>
    <text x="700" y="685" text-anchor="middle" fill="#422006" font-size="15" font-weight="700">2</text>
  </g>
</svg>
