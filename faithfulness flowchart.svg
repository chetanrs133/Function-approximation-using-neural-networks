<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Subtle background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#f3f5f9"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>

    <!-- LLM panel gradient -->
    <linearGradient id="llmPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9ece1"/>
      <stop offset="100%" stop-color="#b9dcc9"/>
    </linearGradient>

    <!-- Document gradient -->
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#fdecc8"/>
    </linearGradient>

    <!-- Yes pill -->
    <linearGradient id="yesPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- No pill -->
    <linearGradient id="noPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d57"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)"/>

  <!-- ===== Model response section (left) ===== -->
  <g filter="url(#softShadow)">
    <!-- Header label -->
    <rect x="50" y="110" width="200" height="46" rx="10" fill="#1e293b"/>
    <text x="150" y="138" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600" letter-spacing="0.3">Model response</text>
  </g>

  <!-- Statement cards -->
  <g>
    <!-- Statement 1 -->
    <rect x="50" y="180" width="220" height="56" rx="10" fill="url(#card)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="78" cy="208" r="10" fill="#e0e7ff"/>
    <text x="78" y="212" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">1</text>
    <text x="100" y="213" fill="#0f172a" font-size="15" font-weight="500">Statement 1</text>

    <!-- Statement 2 -->
    <rect x="50" y="252" width="220" height="56" rx="10" fill="url(#card)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="78" cy="280" r="10" fill="#e0e7ff"/>
    <text x="78" y="284" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">2</text>
    <text x="100" y="285" fill="#0f172a" font-size="15" font-weight="500">Statement 2</text>

    <!-- Ellipsis -->
    <g fill="#94a3b8">
      <circle cx="155" cy="334" r="3"/>
      <circle cx="170" cy="334" r="3"/>
      <circle cx="185" cy="334" r="3"/>
    </g>

    <!-- Statement N -->
    <rect x="50" y="356" width="220" height="56" rx="10" fill="url(#card)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="78" cy="384" r="10" fill="#e0e7ff"/>
    <text x="78" y="388" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">N</text>
    <text x="100" y="389" fill="#0f172a" font-size="15" font-weight="500">Statement N</text>
  </g>

  <!-- ===== Grounding documents (top) ===== -->
  <g filter="url(#softShadow)">
    <!-- Stacked doc effect -->
    <rect x="540" y="38" width="170" height="120" rx="8" fill="#f5e7c2" stroke="#d4a84a" stroke-width="1"/>
    <rect x="528" y="48" width="170" height="120" rx="8" fill="#f8ecc9" stroke="#d4a84a" stroke-width="1"/>
    <rect x="516" y="58" width="170" height="120" rx="8" fill="url(#doc)" stroke="#c08b2e" stroke-width="1.2"/>
    <!-- Folded corner -->
    <path d="M666 58 L686 58 L686 78 Z" fill="#e6c989" stroke="#c08b2e" stroke-width="1.2"/>
    <!-- Lines on doc -->
    <line x1="528" y1="100" x2="660" y2="100" stroke="#c9a55a" stroke-width="1" opacity="0.4"/>
    <line x1="528" y1="115" x2="660" y2="115" stroke="#c9a55a" stroke-width="1" opacity="0.4"/>
    <line x1="528" y1="155" x2="660" y2="155" stroke="#c9a55a" stroke-width="1" opacity="0.4"/>
    <text x="601" y="128" text-anchor="middle" fill="#5a3e0c" font-size="14" font-weight="600">Context from</text>
    <text x="601" y="146" text-anchor="middle" fill="#5a3e0c" font-size="14" font-weight="600">grounding documents</text>
  </g>

  <!-- Arrow from docs down into LLM -->
  <path d="M601 180 L601 222" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== LLM Processing Panel (center) ===== -->
  <g filter="url(#softShadow)">
    <rect x="320" y="230" width="560" height="220" rx="18" fill="url(#llmPanel)" stroke="#7fb89a" stroke-width="1.5"/>

    <!-- Brain / chip icon -->
    <g transform="translate(380, 290)">
      <!-- left hemisphere -->
      <path d="M50 10 C30 10, 18 28, 22 48 C12 56, 14 76, 28 82 C32 96, 50 100, 60 92 L60 18 C56 12, 53 10, 50 10 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="2"/>
      <!-- right hemisphere -->
      <path d="M70 10 C90 10, 102 28, 98 48 C108 56, 106 76, 92 82 C88 96, 70 100, 60 92 L60 18 C64 12, 67 10, 70 10 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="2"/>
      <!-- circuit nodes -->
      <circle cx="38" cy="34" r="3.5" fill="#2f7d57"/>
      <circle cx="50" cy="52" r="3.5" fill="#2f7d57"/>
      <circle cx="38" cy="70" r="3.5" fill="#2f7d57"/>
      <circle cx="82" cy="34" r="3.5" fill="#2f7d57"/>
      <circle cx="70" cy="52" r="3.5" fill="#2f7d57"/>
      <circle cx="82" cy="70" r="3.5" fill="#2f7d57"/>
      <!-- connecting lines -->
      <line x1="38" y1="34" x2="50" y2="52" stroke="#2f7d57" stroke-width="1.5"/>
      <line x1="50" y1="52" x2="38" y2="70" stroke="#2f7d57" stroke-width="1.5"/>
      <line x1="82" y1="34" x2="70" y2="52" stroke="#2f7d57" stroke-width="1.5"/>
      <line x1="70" y1="52" x2="82" y2="70" stroke="#2f7d57" stroke-width="1.5"/>
      <line x1="50" y1="52" x2="70" y2="52" stroke="#2f7d57" stroke-width="1.5"/>
      <!-- pin stubs -->
      <line x1="22" y1="40" x2="14" y2="40" stroke="#2f7d57" stroke-width="2"/>
      <line x1="22" y1="60" x2="14" y2="60" stroke="#2f7d57" stroke-width="2"/>
      <line x1="98" y1="40" x2="106" y2="40" stroke="#2f7d57" stroke-width="2"/>
      <line x1="98" y1="60" x2="106" y2="60" stroke="#2f7d57" stroke-width="2"/>
    </g>

    <!-- Label text -->
    <text x="620" y="310" fill="#14532d" font-size="22" font-weight="700">Prompting LLM:</text>
    <line x1="620" y1="322" x2="820" y2="322" stroke="#2f7d57" stroke-width="1.5" opacity="0.5"/>
    <text x="620" y="356" fill="#1f3a2c" font-size="16" font-weight="500">Verdicts for</text>
    <text x="620" y="378" fill="#1f3a2c" font-size="16" font-weight="500">statements</text>
    <text x="620" y="406" fill="#2f7d57" font-size="14" font-weight="700" font-style="italic">( Yes / No )</text>
  </g>

  <!-- Arrows from statements into LLM panel -->
  <path d="M270 208 C300 208, 310 280, 320 290" stroke="#64748b" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path d="M270 280 L320 320" stroke="#64748b" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path d="M270 384 C300 384, 310 380, 320 360" stroke="#64748b" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Arrow from LLM to verdicts -->
  <path d="M880 340 L930 340" stroke="#2f7d57" stroke-width="2.5" fill="none" marker-end="url(#arrowAccent)"/>

  <!-- ===== Verdict cards (right) ===== -->
  <g font-size="14">
    <!-- Verdict 1: Yes -->
    <g filter="url(#softShadow)">
      <rect x="940" y="220" width="220" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="940" y="220" width="70" height="60" rx="12" fill="url(#yesPill)"/>
      <rect x="1003" y="220" width="7" height="60" fill="url(#yesPill)"/>
      <text x="975" y="257" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Yes</text>
      <text x="1085" y="257" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="500">Supporting explanation</text>
    </g>

    <!-- Verdict 2: Yes -->
    <g filter="url(#softShadow)">
      <rect x="940" y="296" width="220" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="940" y="296" width="70" height="60" rx="12" fill="url(#yesPill)"/>
      <rect x="1003" y="296" width="7" height="60" fill="url(#yesPill)"/>
      <text x="975" y="333" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Yes</text>
      <text x="1085" y="333" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="500">Supporting explanation</text>
    </g>

    <!-- ellipsis between -->
    <g fill="#94a3b8">
      <circle cx="1050" cy="382" r="2.5"/>
      <circle cx="1062" cy="382" r="2.5"/>
      <circle cx="1074" cy="382" r="2.5"/>
    </g>

    <!-- Verdict N: No -->
    <g filter="url(#softShadow)">
      <rect x="940" y="400" width="220" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="940" y="400" width="70" height="60" rx="12" fill="url(#noPill)"/>
      <rect x="1003" y="400" width="7" height="60" fill="url(#noPill)"/>
      <text x="975" y="437" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">No</text>
      <text x="1085" y="437" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="500">Supporting explanation</text>
    </g>
  </g>

  <!-- ===== Faithfulness score formula ===== -->
  <g filter="url(#softShadow)">
    <rect x="220" y="520" width="760" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>

    <text x="290" y="592" fill="#0f172a" font-size="22" font-style="italic" font-weight="500">Faithfulness score</text>
    <text x="510" y="592" fill="#0f172a" font-size="26" font-weight="500">=</text>

    <!-- Numerator -->
    <text x="740" y="572" text-anchor="middle" fill="#0f172a" font-size="20" font-style="italic">
      Number of supported sentences <tspan font-weight="700" fill="#16a34a">(V)</tspan>
    </text>
    <!-- Fraction bar -->
    <line x1="555" y1="585" x2="925" y2="585" stroke="#0f172a" stroke-width="2"/>
    <!-- Denominator -->
    <text x="740" y="615" text-anchor="middle" fill="#0f172a" font-size="20" font-style="italic">
      total number of sentences <tspan font-weight="700" fill="#475569">(S)</tspan>
    </text>
  </g>
</svg>
