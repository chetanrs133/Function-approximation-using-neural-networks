<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 940" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#f3f5f9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="llmGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9ece1"/>
      <stop offset="100%" stop-color="#b9dcc9"/>
    </linearGradient>
    <linearGradient id="llmBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dce6f5"/>
      <stop offset="100%" stop-color="#b9c9e8"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#fdecc8"/>
    </linearGradient>
    <linearGradient id="queryCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="responseCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="yesPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="noPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="1.5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d57"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5dab"/>
    </marker>
  </defs>

  <rect width="720" height="940" fill="url(#bg)"/>

  <!-- ===== TOP ROW: Docs + Query ===== -->
  <!-- Grounding Documents -->
  <g filter="url(#softShadow)">
    <rect x="60" y="40" width="170" height="110" rx="7" fill="#f5e7c2" stroke="#d4a84a" stroke-width="1"/>
    <rect x="50" y="50" width="170" height="110" rx="7" fill="#f8ecc9" stroke="#d4a84a" stroke-width="1"/>
    <rect x="40" y="60" width="170" height="110" rx="7" fill="url(#doc)" stroke="#c08b2e" stroke-width="1.2"/>
    <path d="M192 60 L210 60 L210 78 Z" fill="#e6c989" stroke="#c08b2e" stroke-width="1.2"/>
    <line x1="52" y1="98" x2="184" y2="98" stroke="#c9a55a" stroke-width="1" opacity="0.4"/>
    <line x1="52" y1="112" x2="184" y2="112" stroke="#c9a55a" stroke-width="1" opacity="0.4"/>
    <line x1="52" y1="148" x2="184" y2="148" stroke="#c9a55a" stroke-width="1" opacity="0.4"/>
    <text x="125" y="120" text-anchor="middle" fill="#5a3e0c" font-size="14" font-weight="700">Grounding</text>
    <text x="125" y="138" text-anchor="middle" fill="#5a3e0c" font-size="14" font-weight="700">Documents</text>
  </g>

  <!-- Customer Query -->
  <g filter="url(#softShadow)">
    <rect x="430" y="60" width="240" height="88" rx="12" fill="url(#queryCard)" stroke="#fb923c" stroke-width="1.4"/>
    <circle cx="460" cy="92" r="14" fill="#fb923c"/>
    <text x="460" y="97" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">?</text>
    <text x="485" y="88" fill="#7c2d12" font-size="11.5" font-weight="700" letter-spacing="0.5">CUSTOMER QUERY</text>
    <text x="485" y="110" fill="#0f172a" font-size="14" font-weight="500">How to remove</text>
    <text x="485" y="128" fill="#0f172a" font-size="14" font-weight="500">passkey?</text>
  </g>

  <!-- Arrows converging into Extract LLM -->
  <path d="M210 165 C260 180, 290 195, 320 215" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 150 C470 175, 430 200, 410 215" stroke="#475569" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ===== EXTRACT LLM (centered) ===== -->
  <g filter="url(#softShadow)">
    <rect x="220" y="220" width="290" height="90" rx="14" fill="url(#llmBlue)" stroke="#7a92c1" stroke-width="1.4"/>
    <!-- chip icon -->
    <g transform="translate(240, 240)">
      <rect x="0" y="0" width="50" height="50" rx="6" fill="#ffffff" stroke="#3b5dab" stroke-width="1.6"/>
      <rect x="11" y="11" width="28" height="28" rx="3" fill="#dce6f5" stroke="#3b5dab" stroke-width="1.2"/>
      <text x="25" y="31" text-anchor="middle" fill="#3b5dab" font-size="12" font-weight="700">AI</text>
      <g stroke="#3b5dab" stroke-width="1.6">
        <line x1="-5" y1="15" x2="0" y2="15"/>
        <line x1="-5" y1="25" x2="0" y2="25"/>
        <line x1="-5" y1="35" x2="0" y2="35"/>
        <line x1="50" y1="15" x2="55" y2="15"/>
        <line x1="50" y1="25" x2="55" y2="25"/>
        <line x1="50" y1="35" x2="55" y2="35"/>
      </g>
    </g>
    <text x="320" y="258" fill="#1e3a8a" font-size="14.5" font-weight="700">Prompting LLM</text>
    <text x="320" y="278" fill="#1e3a8a" font-size="14.5" font-weight="700">to extract</text>
    <text x="320" y="298" fill="#1e3a8a" font-size="14.5" font-weight="700">key facts</text>
  </g>

  <!-- Arrow down to facts -->
  <path d="M365 312 L365 338" stroke="#3b5dab" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- ===== FACTS column (left) ===== -->
  <g>
    <!-- Fact 1 -->
    <g filter="url(#softShadow)">
      <rect x="30" y="345" width="320" height="70" rx="9" fill="url(#card)" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="30" y="345" width="5" height="70" fill="#16a34a" rx="2.5"/>
      <text x="48" y="367" fill="#16a34a" font-size="11" font-weight="700" letter-spacing="0.5">FACT 1</text>
      <text x="48" y="388" fill="#0f172a" font-size="13" font-weight="500">You can remove your Wells Fargo</text>
      <text x="48" y="405" fill="#0f172a" font-size="13" font-weight="500">passkey in the app.</text>
    </g>

    <!-- Fact 2 -->
    <g filter="url(#softShadow)">
      <rect x="30" y="430" width="320" height="86" rx="9" fill="url(#card)" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="30" y="430" width="5" height="86" fill="#16a34a" rx="2.5"/>
      <text x="48" y="452" fill="#16a34a" font-size="11" font-weight="700" letter-spacing="0.5">FACT 2</text>
      <text x="48" y="473" fill="#0f172a" font-size="13" font-weight="500">Go to Security Center. Under</text>
      <text x="48" y="490" fill="#0f172a" font-size="13" font-weight="500">More security options, select</text>
      <text x="48" y="507" fill="#0f172a" font-size="13" font-weight="500">Passkey.</text>
    </g>

    <!-- Fact N -->
    <g filter="url(#softShadow)">
      <rect x="30" y="531" width="320" height="86" rx="9" fill="url(#card)" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="30" y="531" width="5" height="86" fill="#dc2626" rx="2.5"/>
      <text x="48" y="553" fill="#dc2626" font-size="11" font-weight="700" letter-spacing="0.5">FACT N</text>
      <text x="48" y="574" fill="#0f172a" font-size="13" font-weight="500">You can also manage passkey</text>
      <text x="48" y="591" fill="#0f172a" font-size="13" font-weight="500">settings from Security &amp; Support</text>
      <text x="48" y="608" fill="#0f172a" font-size="13" font-weight="500">on a computer.</text>
    </g>
  </g>

  <!-- ===== VERDICT LLM (vertical strip in middle-right) ===== -->
  <g filter="url(#softShadow)">
    <rect x="380" y="345" width="120" height="272" rx="14" fill="url(#llmGreen)" stroke="#7fb89a" stroke-width="1.4"/>
    <!-- brain icon -->
    <g transform="translate(400, 360)">
      <path d="M40 8 C24 8, 14 24, 18 40 C10 46, 12 62, 22 68 C26 80, 40 82, 48 76 L48 14 C44 10, 42 8, 40 8 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="1.8"/>
      <path d="M56 8 C72 8, 82 24, 78 40 C86 46, 84 62, 74 68 C70 80, 56 82, 48 76 L48 14 C52 10, 54 8, 56 8 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="1.8"/>
      <circle cx="30" cy="28" r="2.4" fill="#2f7d57"/>
      <circle cx="40" cy="42" r="2.4" fill="#2f7d57"/>
      <circle cx="30" cy="56" r="2.4" fill="#2f7d57"/>
      <circle cx="66" cy="28" r="2.4" fill="#2f7d57"/>
      <circle cx="56" cy="42" r="2.4" fill="#2f7d57"/>
      <circle cx="66" cy="56" r="2.4" fill="#2f7d57"/>
      <line x1="30" y1="28" x2="40" y2="42" stroke="#2f7d57" stroke-width="1.2"/>
      <line x1="40" y1="42" x2="30" y2="56" stroke="#2f7d57" stroke-width="1.2"/>
      <line x1="66" y1="28" x2="56" y2="42" stroke="#2f7d57" stroke-width="1.2"/>
      <line x1="56" y1="42" x2="66" y2="56" stroke="#2f7d57" stroke-width="1.2"/>
      <line x1="40" y1="42" x2="56" y2="42" stroke="#2f7d57" stroke-width="1.2"/>
    </g>
    <text x="440" y="478" text-anchor="middle" fill="#14532d" font-size="12.5" font-weight="700">Prompting</text>
    <text x="440" y="495" text-anchor="middle" fill="#14532d" font-size="12.5" font-weight="700">LLM to</text>
    <text x="440" y="512" text-anchor="middle" fill="#14532d" font-size="12.5" font-weight="700">provide</text>
    <text x="440" y="529" text-anchor="middle" fill="#14532d" font-size="12.5" font-weight="700">verdict for</text>
    <text x="440" y="546" text-anchor="middle" fill="#14532d" font-size="12.5" font-weight="700">each key</text>
    <text x="440" y="563" text-anchor="middle" fill="#14532d" font-size="12.5" font-weight="700">fact</text>
  </g>

  <!-- Arrows from facts into verdict LLM -->
  <path d="M350 380 L380 395" stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M350 473 L380 480" stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M350 574 L380 565" stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- ===== Verdict pills (right) ===== -->
  <g>
    <g filter="url(#softShadow)">
      <ellipse cx="600" cy="380" rx="42" ry="24" fill="url(#yesPill)"/>
      <text x="600" y="386" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Yes</text>
    </g>
    <g filter="url(#softShadow)">
      <ellipse cx="600" cy="473" rx="42" ry="24" fill="url(#yesPill)"/>
      <text x="600" y="479" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Yes</text>
    </g>
    <g filter="url(#softShadow)">
      <ellipse cx="600" cy="574" rx="42" ry="24" fill="url(#noPill)"/>
      <text x="600" y="580" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">No</text>
    </g>
  </g>

  <!-- Arrows from verdict LLM to pills -->
  <path d="M500 395 L558 380" stroke="#2f7d57" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M500 480 L558 473" stroke="#2f7d57" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M500 565 L558 574" stroke="#2f7d57" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- ===== Model Response (below) ===== -->
  <!-- Convergence arrows -->
  <path d="M600 600 C600 630, 480 660, 400 670" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="100" y="670" width="520" height="100" rx="12" fill="url(#responseCard)" stroke="#818cf8" stroke-width="1.4"/>
    <rect x="100" y="670" width="520" height="28" rx="12" fill="#4f46e5"/>
    <rect x="100" y="688" width="520" height="10" fill="#4f46e5"/>
    <text x="360" y="690" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700" letter-spacing="0.4">MODEL RESPONSE</text>
    <text x="360" y="725" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="500">To remove passkey in the app, go to security center and</text>
    <text x="360" y="745" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="500">select passkey under more security options.</text>
  </g>

  <!-- ===== Completeness Formula ===== -->
  <g filter="url(#softShadow)">
    <rect x="50" y="800" width="620" height="110" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="100" y="867" fill="#0f172a" font-size="19" font-style="italic" font-weight="500">Completeness</text>
    <text x="263" y="867" fill="#0f172a" font-size="22" font-weight="500">=</text>
    <text x="475" y="850" text-anchor="middle" fill="#0f172a" font-size="16" font-style="italic">
      Number of <tspan font-weight="700" fill="#16a34a">"Yes"</tspan> verdicts
    </text>
    <line x1="295" y1="862" x2="655" y2="862" stroke="#0f172a" stroke-width="1.8"/>
    <text x="475" y="890" text-anchor="middle" fill="#0f172a" font-size="16" font-style="italic">
      Total number of <tspan font-weight="700" fill="#475569">key critical facts</tspan>
    </text>
  </g>
</svg>
