<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 970" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#f3f5f9"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="redCardSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="llmGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9ece1"/>
      <stop offset="100%" stop-color="#b9dcc9"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="amberSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="scoreGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="scoreAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="scoreRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="1.5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="720" height="970" fill="url(#bg)"/>

  <!-- ===== TOP: Three input chips ===== -->
  <g font-size="12" font-weight="700">
    <!-- Transaction Description -->
    <g filter="url(#softShadow)">
      <rect x="20" y="20" width="200" height="70" rx="10" fill="url(#redCard)"/>
      <rect x="20" y="20" width="200" height="22" rx="10" fill="rgba(255,255,255,0.12)"/>
      <text x="120" y="56" text-anchor="middle" fill="#ffffff" font-size="13.5">Transaction</text>
      <text x="120" y="74" text-anchor="middle" fill="#ffffff" font-size="13.5">Description</text>
    </g>
    <!-- Transaction status -->
    <g filter="url(#softShadow)">
      <rect x="248" y="20" width="220" height="70" rx="10" fill="url(#redCard)"/>
      <rect x="248" y="20" width="220" height="22" rx="10" fill="rgba(255,255,255,0.12)"/>
      <text x="358" y="48" text-anchor="middle" fill="#ffffff" font-size="13.5">Transaction status</text>
      <text x="358" y="66" text-anchor="middle" fill="#ffffff" font-size="13.5">(Pending vs Posted)</text>
    </g>
    <!-- User utterance -->
    <g filter="url(#softShadow)">
      <rect x="496" y="20" width="200" height="70" rx="10" fill="url(#redCard)"/>
      <rect x="496" y="20" width="200" height="22" rx="10" fill="rgba(255,255,255,0.12)"/>
      <text x="596" y="48" text-anchor="middle" fill="#ffffff" font-size="13.5">User utterance</text>
      <text x="596" y="66" text-anchor="middle" fill="#ffffff" font-size="13.5">(dispute, cancel, or fraud)</text>
    </g>
  </g>

  <!-- Converging arrows into Model Response -->
  <path d="M120 92 C120 115, 280 130, 320 145" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M358 92 L358 145" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M596 92 C596 115, 440 130, 396 145" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== Model Response ===== -->
  <g filter="url(#softShadow)">
    <rect x="220" y="150" width="280" height="80" rx="10" fill="url(#redCardSoft)"/>
    <text x="360" y="178" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700" letter-spacing="0.4">MODEL RESPONSE</text>
    <line x1="245" y1="186" x2="475" y2="186" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="360" y="208" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="500">Merchant info +</text>
    <text x="360" y="224" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="500">Suggestions</text>
  </g>

  <!-- Arrow to LLM -->
  <path d="M360 232 L360 258" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== Prompting LLM panel ===== -->
  <g filter="url(#softShadow)">
    <rect x="200" y="262" width="320" height="120" rx="16" fill="url(#llmGreen)" stroke="#7fb89a" stroke-width="1.4"/>
    <!-- brain icon -->
    <g transform="translate(245, 282)">
      <path d="M40 8 C24 8, 14 24, 18 40 C10 46, 12 62, 22 68 C26 80, 40 82, 48 76 L48 14 C44 10, 42 8, 40 8 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="2"/>
      <path d="M56 8 C72 8, 82 24, 78 40 C86 46, 84 62, 74 68 C70 80, 56 82, 48 76 L48 14 C52 10, 54 8, 56 8 Z"
            fill="#ffffff" stroke="#2f7d57" stroke-width="2"/>
      <circle cx="30" cy="28" r="2.8" fill="#2f7d57"/>
      <circle cx="40" cy="42" r="2.8" fill="#2f7d57"/>
      <circle cx="30" cy="56" r="2.8" fill="#2f7d57"/>
      <circle cx="66" cy="28" r="2.8" fill="#2f7d57"/>
      <circle cx="56" cy="42" r="2.8" fill="#2f7d57"/>
      <circle cx="66" cy="56" r="2.8" fill="#2f7d57"/>
      <line x1="30" y1="28" x2="40" y2="42" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="40" y1="42" x2="30" y2="56" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="66" y1="28" x2="56" y2="42" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="56" y1="42" x2="66" y2="56" stroke="#2f7d57" stroke-width="1.4"/>
      <line x1="40" y1="42" x2="56" y2="42" stroke="#2f7d57" stroke-width="1.4"/>
    </g>
    <text x="400" y="328" text-anchor="middle" fill="#14532d" font-size="20" font-weight="700">Prompting</text>
    <text x="400" y="354" text-anchor="middle" fill="#14532d" font-size="20" font-weight="700">LLM</text>
  </g>

  <!-- Branch arrows: LLM → Judge Section 0 (left) and Judge Section 1 (right) -->
  <path d="M200 322 C150 322, 130 405, 130 425" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 322 C570 322, 590 405, 590 425" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== Judge Section 0 header (left) ===== -->
  <g filter="url(#softShadow)">
    <rect x="30" y="425" width="200" height="60" rx="10" fill="url(#amberCard)" stroke="#a16207" stroke-width="1.2"/>
    <text x="130" y="450" text-anchor="middle" fill="#422006" font-size="14.5" font-weight="700">Judge Section 0</text>
    <text x="130" y="471" text-anchor="middle" fill="#422006" font-size="13.5" font-weight="600">Merchant Info</text>
  </g>

  <!-- ===== Judge Section 1 header (right) ===== -->
  <g filter="url(#softShadow)">
    <rect x="490" y="425" width="200" height="60" rx="10" fill="url(#amberCard)" stroke="#a16207" stroke-width="1.2"/>
    <text x="590" y="450" text-anchor="middle" fill="#422006" font-size="14.5" font-weight="700">Judge Section 1</text>
    <text x="590" y="471" text-anchor="middle" fill="#422006" font-size="13.5" font-weight="600">Suggestions</text>
  </g>

  <!-- Branch lines down from each judge -->
  <path d="M130 485 L130 660" stroke="#94a3b8" stroke-width="1.4" fill="none"/>
  <path d="M590 485 L590 660" stroke="#94a3b8" stroke-width="1.4" fill="none"/>

  <!-- ===== Score chips - Section 0 (left) ===== -->
  <g font-size="12.5" font-weight="600">
    <!-- 1.0 Correct -->
    <path d="M130 525 L155 525" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="160" y="510" width="170" height="32" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="160" y="510" width="50" height="32" rx="16" fill="url(#scoreGreen)"/>
      <text x="185" y="531" text-anchor="middle" fill="#ffffff" font-weight="700">1.0</text>
      <text x="275" y="531" text-anchor="middle" fill="#14532d">Correct</text>
    </g>

    <!-- 0.5 Minor Issues -->
    <path d="M130 585 L155 585" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="160" y="570" width="170" height="32" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="160" y="570" width="50" height="32" rx="16" fill="url(#scoreAmber)"/>
      <text x="185" y="591" text-anchor="middle" fill="#ffffff" font-weight="700">0.5</text>
      <text x="275" y="591" text-anchor="middle" fill="#78350f">Minor Issues</text>
    </g>

    <!-- 0.0 Major Issues -->
    <path d="M130 645 L155 645" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="160" y="630" width="170" height="32" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="160" y="630" width="50" height="32" rx="16" fill="url(#scoreRed)"/>
      <text x="185" y="651" text-anchor="middle" fill="#ffffff" font-weight="700">0.0</text>
      <text x="275" y="651" text-anchor="middle" fill="#7f1d1d">Major Issues</text>
    </g>
  </g>

  <!-- ===== Score chips - Section 1 (right) ===== -->
  <g font-size="12.5" font-weight="600">
    <!-- 1.0 Correct -->
    <path d="M590 525 L565 525" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="390" y="510" width="170" height="32" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="510" y="510" width="50" height="32" rx="16" fill="url(#scoreGreen)"/>
      <text x="535" y="531" text-anchor="middle" fill="#ffffff" font-weight="700">1.0</text>
      <text x="445" y="531" text-anchor="middle" fill="#14532d">Correct</text>
    </g>

    <!-- 0.5 Minor Issues -->
    <path d="M590 585 L565 585" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="390" y="570" width="170" height="32" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="510" y="570" width="50" height="32" rx="16" fill="url(#scoreAmber)"/>
      <text x="535" y="591" text-anchor="middle" fill="#ffffff" font-weight="700">0.5</text>
      <text x="445" y="591" text-anchor="middle" fill="#78350f">Minor Issues</text>
    </g>

    <!-- 0.0 Major Issues -->
    <path d="M590 645 L565 645" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g filter="url(#softShadow)">
      <rect x="390" y="630" width="170" height="32" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="510" y="630" width="50" height="32" rx="16" fill="url(#scoreRed)"/>
      <text x="535" y="651" text-anchor="middle" fill="#ffffff" font-weight="700">0.0</text>
      <text x="445" y="651" text-anchor="middle" fill="#7f1d1d">Major Issues</text>
    </g>
  </g>

  <!-- Converging lines into "Scores with explanations" -->
  <path d="M130 661 C130 720, 280 740, 320 760" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M590 661 C590 720, 440 740, 400 760" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- ===== Scores with explanations ===== -->
  <g filter="url(#softShadow)">
    <rect x="240" y="760" width="240" height="60" rx="10" fill="url(#amberCard)" stroke="#a16207" stroke-width="1.2"/>
    <text x="360" y="785" text-anchor="middle" fill="#422006" font-size="14.5" font-weight="700">Scores with</text>
    <text x="360" y="805" text-anchor="middle" fill="#422006" font-size="14.5" font-weight="700">explanations</text>
  </g>

  <!-- Arrow down to formula -->
  <path d="M360 822 L360 845" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- ===== Overall correctness formula ===== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="850" width="640" height="100" rx="14" fill="url(#amberSoft)" stroke="#d97706" stroke-width="1.4"/>
    <text x="85" y="908" fill="#422006" font-size="17" font-style="italic" font-weight="600">Overall correctness score</text>
    <text x="370" y="908" fill="#422006" font-size="20" font-weight="600">=</text>
    <!-- Numerator -->
    <text x="540" y="893" text-anchor="middle" fill="#422006" font-size="15" font-style="italic" font-weight="600">
      Section 0 Score + Section 1 Score
    </text>
    <line x1="400" y1="903" x2="660" y2="903" stroke="#422006" stroke-width="1.8"/>
    <!-- Denominator -->
    <text x="540" y="925" text-anchor="middle" fill="#422006" font-size="17" font-weight="700">2</text>
  </g>
</svg>
